<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f1f">
  <meta name="description" content="Aprende álgebra, trigonometría, cálculo y física con clips verticales y ejercicios interactivos.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" href="icons/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
    (function () {
      var t = 'system';
      try { t = (JSON.parse(localStorage.getItem('zuka-v1')) || {}).theme || 'system'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">

  <link rel="stylesheet" href="css/styles.css">

  <script defer src="js/games/kit.js"></script>
  <script defer src="js/games/cajas-numericas.js"></script>

  <script defer src="js/courses/algebra.js"></script>
  <script defer src="js/courses/trig.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/player.js"></script>

  <script defer src="js/app.js"></script>

  <div id="app">
    <header id="topbar"></header>
    <main id="view"></main>
    <nav id="tabbar" aria-label="Secciones">
      <button data-tab="learn">Aprender</button>
