const K = 0.965;   // 308 s del guion → 297 s: entre 4 y 5 minutos

Promise.all(['300 40px Jost', '340 40px Jost', '500 40px Jost', 'italic 300 40px Jost', '400 40px KMain', 'italic 400 40px KMain', 'italic 400 40px KMath', '400 40px Georgia', 'italic 400 40px Georgia', "400 40px 'Cambria Math'"].map(f => document.fonts.load(f, 'Áx∈∉{}ε⇒≠…'))).then(() => document.fonts.ready).then(() => {
