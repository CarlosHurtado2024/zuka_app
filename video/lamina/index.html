<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Zuka · lámina</title>
<style>
@font-face{font-family:Jost;src:url(fonts/Jost.ttf) format('truetype');font-weight:100 900;}
html,body{margin:0;background:#0B0E24;overflow:hidden}
canvas{position:absolute;left:0;top:0;display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="plates.js"></script>
<script src="timeline.js"></script>
<script src="kit.js"></script>
<script>
// ?f=<nombre> carga films/<nombre>.js; ?t=<segundos> muestra ese cuadro; ?s=neon, el estilo neón
const Q = new URLSearchParams(location.search), NAME = Q.get('f') || 'tipos';
X = document.getElementById('c').getContext('2d');
const s = document.createElement('script'); s.src = 'films/' + NAME + '.js';
s.onload = () => {
  P.ac = PLATES[FILM.world].ac; if (P.ac.toUpperCase() === '#FF8A7A') P.no = '#FFB86B';
  if (Q.get('s') === 'neon') { setNeon(); document.body.style.background = P.bg; }
  TL = timeline(FILM);
  const img = new Image();
  img.onload = () => { PLATE_IMG = img; start(); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(PLATES[FILM.world].svg);
};
document.head.appendChild(s);
window.render = t => renderFilm(Math.max(0, Math.min(TL.DUR, t)));
function start() {
  Promise.all(['500 40px Jost', '600 40px Jost', '400 40px Georgia', 'italic 400 40px Georgia', '400 40px Cambria', "400 40px 'Cambria Math'"].map(f => document.fonts.load(f, 'Áx∈∉{}√∑')))
    .then(() => document.fonts.ready).then(() => {
      window.DUR = TL.DUR;
      window.EV = TL.EV.concat([{ t: 0, type: 'narr', lines: TL.NARR }, { t: 0, type: 'meta', key: FILM.key || 'D', world: FILM.world }]).sort((a, b) => a.t - b.t);
      window.TEXTS = t => { REC = []; window.render(t); const r = REC; REC = null; return r; };
      window.render(+(Q.get('t') || 0));
      window.READY = true;
    });
}
</script>
</body></html>
