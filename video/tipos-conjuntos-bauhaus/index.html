<!doctype html>
<html><head><meta charset="utf-8"><title>Tipos de conjuntos y relaciones · Bauhaus Shapes</title>
<style>
  @font-face{font-family:"BH Sans";src:url(fonts/Jost-VF.ttf) format("truetype");font-weight:100 900}
  html,body{margin:0;overflow:hidden;background:#F6F4EE}
  canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Zuka · lección alg-0b «Tipos de conjuntos y relaciones entre ellos», estilo Bauhaus Shapes (vertical 1080×1920, 30 fps).
// Solo círculos, cuadrados, triángulos, arcos y rectas; colores planos con bordes duros. La película está en film.js.
// ?tex=0 quita la textura de papel · ?cut=a:b dibuja solo ese tramo.
import { mulberry, clamp, lerp } from '/core/lib.js';
import { setupFilm } from './film.js';
const Q = new URLSearchParams(location.search), TEX = Q.get('tex') !== '0';

// Seis colores por papel (no por tono): papel, protagonista, campo, pivote, secundario y tinta.
const P = { paper:'#F6F4EE', red:'#E4572E', blue:'#3A2FBF', yel:'#F2C230', tint:'#CFCBEF', ink:'#17183B', light:'#F6F4EE' };
const W = 1080, H = 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d', { willReadFrequently: true });
const SANS = '"BH Sans"', TAU = Math.PI*2;

function disc(x,y,r,col){ if (r<=0) return; g.fillStyle=col; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); }
function poly(pts,col){ g.fillStyle=col; g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); g.fill(); }
function rect(x,y,w,h,col){ g.fillStyle=col; g.fillRect(x,y,w,h); }
function line(pts,col,w=5){ g.strokeStyle=col; g.lineWidth=w; g.lineCap='butt'; g.lineJoin='round'; g.beginPath();
  pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); }
function arc(x,y,r,a0,a1,col,w=5){ if (r<=0) return; g.strokeStyle=col; g.lineWidth=w; g.lineCap='butt'; g.beginPath(); g.arc(x,y,r,a0,a1); g.stroke(); }
function cross(x,y,col,s=14,w=2){ line([[x-s,y],[x+s,y]],col,w); line([[x,y-s],[x,y+s]],col,w); }
function measure(str,size,weight=800,fam=SANS,track=0){ g.font=`${weight} ${size}px ${fam}`; g.letterSpacing = track?`${track}px`:'0px'; return g.measureText(str).width; }

// Material: tinta opaca sobre cartulina mate. Grano fino y una deriva muy lenta de densidad; es estático (es el papel).
let TOOTH = null;
function buildTooth(){
  const rnd = mulberry(11), N = new Float32Array(W*H);
  const gw = 28, gh = 48, grid = Array.from({length:(gw+1)*(gh+1)}, ()=>rnd()*2-1);
  const vn = (x,y)=>{ const fx=x/W*gw, fy=y/H*gh, ix=Math.min(gw-1,Math.floor(fx)), iy=Math.min(gh-1,Math.floor(fy)), tx=fx-ix, ty=fy-iy;
    const s=t=>t*t*(3-2*t), a=grid[iy*(gw+1)+ix], b=grid[iy*(gw+1)+ix+1], c=grid[(iy+1)*(gw+1)+ix], d=grid[(iy+1)*(gw+1)+ix+1];
    return lerp(lerp(a,b,s(tx)),lerp(c,d,s(tx)),s(ty)); };
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const fibre = Math.sin(y*0.013+x*0.0035+Math.sin(x*0.002)*3)*0.5 + Math.sin(y*0.0021-x*0.011)*0.5;
    N[y*W+x] = (rnd()-0.5)*1.0 + fibre*0.14 + vn(x,y)*0.22;
  }
  return N;
}
function finish(){
  if (!TEX) return;
  if (!TOOTH) TOOTH = buildTooth();
  const img = g.getImageData(0,0,W,H), d = img.data;
  for (let i=0,p=0;i<d.length;i+=4,p++){
    const n = TOOTH[p], lum = (d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11)/255, amp = 7.5 - lum*2.5;
    d[i]   = clamp(d[i]  + n*amp, 0, 255);
    d[i+1] = clamp(d[i+1]+ n*amp, 0, 255);
    d[i+2] = clamp(d[i+2]+ n*amp*0.85, 0, 255);
  }
  g.putImageData(img,0,0);
}

const F = setupFilm({ g, P, W, H, SANS, disc, poly, rect, line, arc, cross, measure, finish });
const CUT = (Q.get('cut') || `0:${F.FULL}`).split(':').map(Number);
window.DUR = CUT[1]-CUT[0]; window.EV = F.EV; window.FILM_INFO = { full:F.FULL, scenes:F.SC };
window.TEXTS = t => F.texts(CUT[0]+t);
window.render = t => F.render(CUT[0]+t);
await document.fonts.load(`800 100px ${SANS}`); await document.fonts.load(`500 100px ${SANS}`); await document.fonts.load(`300 100px ${SANS}`);
window.READY = true;
</script>
</body></html>
